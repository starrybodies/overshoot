# Runs the repo's sensors on every pull request and on main: typecheck, unit tests, every offline check in
# scripts/checks (including published-data immutability and the more-water figures), lint against its
# committed baseline, and the production build. Make the "check" job a required status check on main.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels an older run of the same pull request. Every push to main gets its own group so
# each before..after range is checked; a cancelled main run could otherwise hide a bad push.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # published-data.mjs compares the working tree with this revision.
      CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm check:build
